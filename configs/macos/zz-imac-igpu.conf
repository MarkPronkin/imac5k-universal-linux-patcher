# /etc/mkinitcpio.conf.d/zz-imac-igpu.conf -- iMac18,3 firmware brightness.
# Written by imac-patcher --apply macos; removed by --remove macos.
# Sorted last, so it runs after the other drop-ins have filled MODULES.
#
# Do not force-load i915. The kernel's module_blacklist=i915,i2c_i801 blocks
# Intel graphics, including explicit loads from earlier initramfs drop-ins.
# The independent experimental igpu patch removes that block when opted into.
# Keep the VBT available for compatibility with existing boot entries; it
# cannot expose a GPU while i915 is blocked.
FILES+=(/usr/lib/firmware/imac18-3/headless-vbt.bin)
# The SMBus-enable rule must run in the initramfs, before systemd-backlight.
FILES+=(/etc/udev/rules.d/62-imac-smbus-acpi.rules)
