# Independent experimental Intel graphics opt-in (imac-patcher --apply igpu).
# Register Intel first for video; the compositor stays on the named Radeon.
# Its no-outputs VBT must be present before i915 probes the device.
MODULES=(i915 "${MODULES[@]}")
FILES+=(/usr/lib/firmware/imac18-3/headless-vbt.bin)
FILES+=(/etc/udev/rules.d/62-imac-smbus-acpi.rules)
