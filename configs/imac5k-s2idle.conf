# Installed by imac-patcher (`--apply suspend`) as
# /etc/systemd/sleep.conf.d/imac5k-s2idle.conf; removed by `--remove suspend`.
#
# Deep S3 sleeps on the iMac18,3, but waking from it resets the machine, so
# suspend has to use s2idle (suspend-to-idle). systemd writes this mode to
# /sys/power/mem_sleep before every suspend, so no kernel argument or boot
# image rebuild is involved. MemorySleepMode= needs systemd 256 or newer.
[Sleep]
MemorySleepMode=s2idle
