# Installed by imac-patcher (`--apply suspend`) as
# /etc/modules-load.d/imac5k-xhci-d0.conf; removed by `--remove suspend`.
#
# iMac18,3: Apple's USB-controller power method (\_SB.PCI0.XHC1._PS3) resets
# the machine on the controller's second D3 entry of a boot, so every second
# suspend rebooted it. This DKMS module keeps Linux from running XHC1's ACPI
# power methods; the controller still sleeps natively and USB wake still works.
imac5k_xhci_d0
