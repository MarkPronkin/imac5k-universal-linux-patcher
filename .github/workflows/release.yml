# Releases are published from the maintainer's own GitHub account (see
# docs/development.md), so GitHub credits each one to a person rather than to
# github-actions. This workflow then checks what was published: it rebuilds the
# tarball from the tagged commit and fails if the uploaded tarball or its
# checksum differ, so what people download always matches a commit in this
# repository and can be reproduced by running scripts/make-release.sh on it.
# Run it by hand to check an existing release again.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0        # make-release.sh archives a git ref

      - name: Check the tag and the pre-release flag
        run: |
          [[ $(git rev-parse HEAD) == "$(git rev-parse "refs/tags/$TAG^{commit}")" ]]
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          # Anything with a suffix (-alpha, -rc1) is a pre-release.
          if [[ $TAG == *-* && $prerelease != true ]]; then
              echo "::error::$TAG has a suffix but is not marked as a pre-release"
              exit 1
          fi

      - name: Check syntax and run offline tests
        run: ./scripts/check.sh

      - name: Install isolated startup test runner
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Require isolated startup tests
        run: sudo env IMAC5K_REQUIRE_STARTUP_TESTS=1 python3 -m unittest discover -s tests -p 'test_startup.py' -v

      - name: Rebuild the release tarball
        run: |
          # The release tests leave their own archives in dist/, and
          # SHA256SUMS lists every archive there.
          sudo rm -rf dist
          scripts/make-release.sh "${TAG#v}" "refs/tags/$TAG"

      - name: Compare with the published files
        run: |
          archive="imac5k-patcher-${TAG#v}.tar.gz"
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published \
              --pattern "$archive" --pattern SHA256SUMS
          cmp "dist/$archive" "published/$archive"
          cmp dist/SHA256SUMS published/SHA256SUMS
          cat published/SHA256SUMS
