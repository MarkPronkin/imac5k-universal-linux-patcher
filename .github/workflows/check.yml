name: check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and run offline tests
        run: ./scripts/check.sh
      - name: Install isolated startup test runner
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Require isolated startup tests
        # Root is confined to this disposable CI runner. The test mounts the
        # host read-only and runs only fake package managers inside bubblewrap.
        run: sudo env IMAC5K_REQUIRE_STARTUP_TESTS=1 python3 -m unittest discover -s tests -p 'test_startup.py' -v
